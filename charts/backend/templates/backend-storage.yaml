{{- $name := include "backend.fullname" . -}}

{{- if .Values.onprem.enabled }}
# --- On-prem 설정 ---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: {{ $name }}-nfs-pv
spec:
  capacity:
    storage: {{ .Values.persistence.size }}
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: "" 
  nfs:
    server: 10.5.4.110
    path: /mnt/video_data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $name }}-pvc
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: "" 
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
  volumeName: {{ $name }}-nfs-pv

{{- else if .Values.aws.enabled }}
# --- AWS 설정 ---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: {{ $name }}-aws-pv
spec:
  capacity:
    storage: {{ .Values.persistence.size }}
  volumeMode: Filesystem
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  # values.yaml의 efs-sc와 매칭
  storageClassName: {{ .Values.persistence.storageClass | default "efs-sc" }}
  csi:
    driver: efs.csi.aws.com
    # 이미지에서 확인된 ID들로 연결
    volumeHandle: {{ .Values.aws.fileSystemId }}::{{ .Values.aws.accessPointId }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $name }}-pvc
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: {{ .Values.persistence.storageClass | default "efs-sc" }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
  volumeName: {{ $name }}-aws-pv
{{- end }} {{/* 이 end 하나가 전체를 닫아야 합니다 */}}