{{- $name := include "backend.fullname" . -}}

#
# --- On-prem 설정 섹션 --- 
# 
{{- if .Values.onprem.enabled }}
apiVersion: v1
kind: PersistentVolume
metadata:
  name: {{ $name }}-nfs-pv
spec:
  capacity:
    storage: {{ .Values.persistence.size }}
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  nfs:
    server: 10.5.4.110
    path: /mnt/video_data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $name }}-pvc
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: ""
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
  volumeName: {{ $name }}-nfs-pv
{{- end }}

#
# --- AWS 설정 섹션 ---
#

{{- if .Values.aws.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $name }}-pvc
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: {{ .Values.persistence.storageClass | quote }} # efs-sc 사용
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
{{- end }}