{{- $name := include "backend.fullname" . -}}

{{- if .Values.onprem.enabled }}
apiVersion: v1
kind: PersistentVolume
metadata:
  name: {{ $name }}-nfs-pv
spec:
  capacity:
    storage: {{ .Values.persistence.size }}
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""   # ✅ onprem 정적 PV/PVC 필수
  nfs:
    server: 10.5.4.110
    path: /mnt/video_data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $name }}-pvc
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: ""   # ✅ default SC 방지
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
  volumeName: {{ $name }}-nfs-pv

{{- else if .Values.aws.enabled }}
apiVersion: v1
kind: PersistentVolume
metadata:
  name: {{ $name }}-aws-pv  # AWS 전용 PV 이름
spec:
  capacity:
    storage: {{ .Values.persistence.size }}
  volumeMode: Filesystem
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: {{ .Values.persistence.storageClass }}
  csi:
    driver: efs.csi.aws.com
    # 여기에 새 EFS ID와 Access Point ID를 넣어야 합니다.
    # values-aws.yaml에 아래 변수들을 추가할 예정입니다.
    volumeHandle: {{ .Values.aws.fileSystemId }}::{{ .Values.aws.accessPointId }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $name }}-pvc
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: {{ .Values.persistence.storageClass }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
  volumeName: {{ $name }}-aws-pv # 위에서 만든 PV와 명시적으로 연결
{{- end }}